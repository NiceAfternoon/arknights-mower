M 207 64 210 62 210 60 211 60 214 56 217 57 217 41 232 41 232 219 217 219 217 109 211 109 211 108 207 105 207 100 217 100 217 94 207 94 Z"/>

      <text x="160" y="58" fill="#6C776F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="800" letter-spacing="2.2">ARKNIGHTS AUTOMATION · SCHEDULED TASKS</text>
      <rect x="160" y="74" width="56" height="6" rx="3" fill="#18A058"/>
      <text x="156" y="132" fill="#121A16" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif" font-size="70" font-weight="900" letter-spacing="-2">MOWER</text>
      <text x="58" y="179" fill="#18211D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="800">通过排班计划持续执行</text>
      <text x="58" y="214" fill="#18211D" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif" font-size="28" font-weight="800">基建、日常和长期任务</text>
      <g transform="translate(58 238)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800">
        <rect width="140" height="30" rx="15" fill="#121A16"/>
        <circle cx="17" cy="15" r="5" fill="#5DD493"/>
        <text x="31" y="20" fill="#F7F4EC">OPEN SOURCE</text>
        <text x="160" y="20" fill="#6C776F">WINDOWS · MACOS · LINUX</text>
      </g>
    </g>

    <g id="duty-roster" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif">
      <text x="726" y="53" fill="#6C776F" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="17" font-weight="800" letter-spacing="2.2">TODAY / TASK SCHEDULE</text>
      <path d="M726 69h54" stroke="#F0A020" stroke-width="6" stroke-linecap="round"/>

      <g id="daily-shift" transform="translate(744 170) rotate(1 194 41)">
        <rect width="388" height="82" rx="20" fill="#D6EEDF"/>
        <text x="24" y="29" fill="#2D6F4D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800">02 · DAILY</text>
        <text x="24" y="61" fill="#123222" font-size="24" font-weight="850">日常任务</text>
        <text x="226" y="31" fill="#466959" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800">18:05</text>
        <rect x="301" y="18" width="66" height="28" rx="14" fill="#B9DFC9"/>
        <text x="334" y="37" text-anchor="middle" fill="#2D6F4D" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" font-weight="900">QUEUED</text>
        <text x="226" y="61" fill="#466959" font-size="16">公招 · 邮件 · 线索</text>
      </g>

      <g id="review-shift" transform="translate(726 246) rotate(-.8 204 41)">
        <rect width="408" height="82" rx="20" fill="#DCEAF4"/>
        <text x="24" y="29" fill="#32739A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800">03 · RECORD</text>
        <text x="24" y="61" fill="#173C52" font-size="24" font-weight="850">运行记录</text>
        <text x="226" y="31" fill="#4F748A" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800">06:00</text>
        <text x="226" y="61" fill="#4F748A" font-size="16">日志 · 报表</text>
        <g transform="translate(317 17)">
          <rect width="69" height="48" rx="12" fill="#FFFFFF" stroke="#9CC7DF" stroke-width="2"/>
          <path d="M14 30h9V18h9v12h9V12h9v18" fill="#64BFEC"/>
          <path d="M13 36c11 5 19-4 28 0 6 3 11 0 16-4" fill="none" stroke="#D03050" stroke-width="3" stroke-linecap="round"/>
        </g>
      </g>

      <g id="active-shift" transform="translate(716 78) rotate(-1.2 210 47)">
        <rect x="8" y="8" width="420" height="94" rx="21" fill="#C9C7BE" opacity=".62"/>
        <rect width="420" height="94" rx="21" fill="#121A16"/>
        <text x="25" y="30" fill="#6ED5A0" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="15" font-weight="800">01 · RIIC</text>
        <text x="25" y="67" fill="#F7F4EC" font-size="26" font-weight="850">基建换班</text>
        <text x="236" y="31" fill="#8CA198" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="800">17:00</text>
        <text x="236" y="66" fill="#A6B5AD" font-size="16">room_1_2 → 1_1</text>
        <rect x="329" y="17" width="82" height="29" rx="14.5" fill="#183D2B" stroke="#2D6F4D"/>
        <circle cx="343" cy="31.5" r="5" fill="#5DD493"/>
        <text x="355" y="36" fill="#A9EBC7" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="11" font-weight="900">RUNNING</text>
      </g>
    </g>

    <g id="schedule-line" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="900">
      <path d="M58 350H1142" stroke="#CDCAC1" stroke-width="5" stroke-linecap="round"/>
      <g fill="#F3F0E7" stroke="#A9A79F" stroke-width="3">
        <circle cx="58" cy="350" r="9"/><circle cx="384" cy="350" r="9"/><circle cx="710" cy="350" r="9"/><circle cx="1036" cy="350" r="9"/><circle cx="1142" cy="350" r="9"/>
      </g>
      <g id="schedule-trace">
        <path d="M58 350H1142" stroke="#18A058" stroke-width="5" stroke-linecap="round"/>
        <g fill="#18A058" stroke="#F3F0E7" stroke-width="3">
          <circle cx="58" cy="350" r="9"/><circle cx="384" cy="350" r="9"/><circle cx="710" cy="350" r="9"/><circle cx="1036" cy="350" r="9"/><circle cx="1142" cy="350" r="9"/>
        </g>
      </g>
      <text x="58" y="387" fill="#32739A">CONNECT</text>
      <text x="384" y="387" text-anchor="middle" fill="#2D6F4D">SCHEDULE</text>
      <text x="710" y="387" text-anchor="middle" fill="#8A5A08">EXECUTE</text>
      <text x="1036" y="387" text-anchor="middle" fill="#32739A">RECORD</text>
      <text x="1142" y="387" text-anchor="end" fill="#A04A5C">REPEAT</text>
    </g>
  </g>
</svg>
