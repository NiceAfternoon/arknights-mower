<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
  <title id="title">Arknights Mower 自动化任务排班</title>
  <desc id="desc">Mower 按照排班计划执行基建、日常和长期任务，并记录执行结果。</desc>
  <defs>
    <pattern id="hero-grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#DCD9CF" stroke-width="1"/>
    </pattern>
    <clipPath id="hero-clip">
      <rect width="1200" height="420" rx="30"/>
    </clipPath>
  </defs>

  <g clip-path="url(#hero-clip)">
    <rect width="1200" height="420" fill="#F3F0E7"/>
    <rect width="1200" height="420" fill="url(#hero-grid)" opacity="0.72"/>

    <g id="title-block">
      <rect x="54" y="42" width="82" height="82" rx="22" fill="#121A16"/>
      <path aria-label="Mower 项目标志" transform="translate(60 48) scale(.273)" fill="#F7F4EC" fill-rule="evenodd" d="M 17 158 34 159 34 160 35 160 35 159 37 159 37 158 39 158 39 157 41 157 41 156 44 156 44 155 50 155 50 148 51 148 51 146 52 146 54 143 99 143 99 140 98 140 98 138 97 138 97 136 96 136 96 132 95 132 95 129 94 129 94 124 93 124 93 99 94 99 95 90 96 90 97 84 98 84 98 82 99 82 99 80 100 80 100 78 101 78 103 72 104 72 105 69 108 67 108 65 109 65 109 64 110 64 110 63 111 63 111 62 112 62 112 61 113 61 113 60 114 60 114 59 115 59 115 58 116 58 121 52 123 52 123 51 126 50 127 48 129 48 129 47 131 47 132 45 137 44 137 43 139 43 139 42 141 42 141 41 148 40 148 39 152 39 152 38 158 38 158 37 176 37 176 38 186 39 186 40 189 40 189 41 195 42 195 43 197 43 197 44 199 44 199 45 202 46 202 49 201 49 201 62 199 62 198 60 196 60 196 59 194 59 194 58 192 58 192 57 190 57 190 56 187 56 187 55 184 55 184 54 181 54 181 53 175 53 175 52 158 52 158 53 153 53 153 54 146 55 146 56 144 56 144 57 142 57 142 58 139 58 138 60 134 61 134 62 131 63 126 69 124 69 124 71 119 75 119 77 118 77 117 80 115 81 115 83 114 83 114 85 113 85 113 87 112 87 112 89 111 89 111 92 110 92 110 95 109 95 109 99 108 99 108 105 107 105 107 117 108 117 108 124 109 124 109 128 110 128 111 134 112 134 112 136 113 136 115 142 116 142 117 145 119 146 119 148 120 148 120 149 121 149 121 150 122 150 122 151 123 151 123 152 124 152 124 153 125 153 130 159 132 159 134 162 136 162 136 163 138 163 138 164 140 164 140 165 142 165 142 166 144 166 144 167 147 167 147 168 150 168 150 169 153 169 153 170 159 170 159 171 175 171 175 170 181 170 181 169 184 169 184 168 190 167 190 166 192 166 192 165 198 163 199 161 201 161 201 168 202 168 202 177 201 177 201 178 199 178 199 179 197 179 197 180 195 180 195 181 192 181 192 182 186 183 186 184 175 185 175 186 158 186 158 185 152 185 152 184 144 183 144 182 142 182 142 181 139 181 139 180 137 180 137 179 132 178 131 176 127 175 127 174 124 173 122 170 120 170 120 169 119 169 