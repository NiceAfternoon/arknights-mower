name: Verify Linux manager from measured standalone packages
on:
  push:
    branches: [codex/check-package-size-20261118]
permissions:
  actions: read
  contents: read
jobs:
  manager:
    timeout-minutes: 18
    strategy:
      fail-fast: false
      matrix:
        include:
          - {runner: ubuntu-24.04, arch: x64}
          - {runner: ubuntu-24.04-arm, arch: arm64}
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          run-id: '44299891454'
          name: desktop-${{ matrix.arch }}
          path: archive
      - name: Install documented GTK and tray dependencies and unpack the release
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq xauth xvfb dbus-x11 xdotool libzbar0 libgl1 libgtk-3-0 libwebkit2gtk-4.1-0 gir1.2-gtk-3.0 gir1.2-soup-3.0 gir1.2-webkit2-4.1 gir1.2-ayatanaappindicator3-0.1
          tar -xzf archive/after.tar.gz
      - name: Start manager and verify its registered tray and loaded instance list
        run: |
          xvfb-run -a dbus-run-session -- python3 - <<'PY'
          import os, signal, subprocess, tempfile, time
          from pathlib import Path
          with tempfile.TemporaryDirectory() as tmp:
              ready = Path(tmp) / "manager-ready"
              package = Path("mower").resolve()
              env = dict(os.environ, MOWER_DATA_DIR=tmp, MOWER_SMOKE_READY_FILE=str(ready))
              p = subprocess.Popen([package/"多开管理器"],cwd=package,env=env,start_new_session=True)
              try:
                  deadline=time.monotonic()+90
                  while p.poll() is None and not ready.exists() and time.monotonic()<deadline:
                      time.sleep(.3)
                  assert p.poll() is None and ready.read_text()=="ready"
                  print("Manager tray and window instance list both ready",flush=True)
              finally:
                  try:
                      os.killpg(p.pid, signal.SIGTERM)
                      p.wait(5)
                  except subprocess.TimeoutExpired:
                      os.killpg(p.pid,signal.SIGKILL)
                      p.wait(5)
                  except ProcessLookupError:
                      p.wait(5)
          PY
